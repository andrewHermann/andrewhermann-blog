name: Enforce Workflow Standards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  enforce-pr-workflow:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check if push bypassed PR
        run: |
          echo "🚨 WARNING: Direct push to main branch detected!"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo ""
          echo "This violates workflow standards."
          echo "All changes must go through the PR process."

  validate-branch-naming:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|ci|chore|docs|refactor|test)/.+ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' follows convention"
          else
            echo "❌ Branch name '$BRANCH_NAME' doesn't follow convention"
            echo "Expected prefix: feature/, bugfix/, hotfix/, ci/, chore/, docs/, refactor/, or test/"
            exit 1
          fi

  validate-pr-content:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR has proper content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ${#PR_BODY} -lt 50 ]]; then
            echo "❌ PR description too short (${#PR_BODY} chars)"
            echo "Please provide a detailed description of changes"
            exit 1
          fi

          if [[ ${#PR_TITLE} -lt 10 ]]; then
            echo "❌ PR title too short"
            echo "Please provide a descriptive title"
            exit 1
          fi

          echo "✅ PR has adequate description and title"
