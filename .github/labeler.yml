# Auto-labeling based on file paths (actions/labeler@v6 schema)

frontend:
  - changed-files:
    - any-glob-to-any-file:
      - src/**
      - public/**
      - craco.config.js
      - package.json

backend:
  - changed-files:
    - any-glob-to-any-file:
      - backend/**
      - server.js

admin:
  - changed-files:
    - any-glob-to-any-file:
      - src/admin/**

styling:
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.sass"

database:
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.db"
      - "**/migrations/**"
      - "**/schema/**"

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - "**.md"
      - docs/**

github-actions:
  - changed-files:
    - any-glob-to-any-file:
      - .github/**

security:
  - changed-files:
    - any-glob-to-any-file:
      - SECURITY.md
      - .github/workflows/security.yml
      - "**/auth/**"
